{% extends "base.html" %}
{% block title %}{{ post.title }} — Xurshid{% endblock %}
{% block content %}
<h1>{{ post.title }}</h1>
<p class="meta">{{ post.date }}{% if post.series %} · Series: {{ post.series }}{% endif %}{% if post.tags %} · {{ post.tags | join(', ') }}{% endif %}</p>
<div>{{ post.content | safe }}</div>
{% endblock %}
